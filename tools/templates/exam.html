<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#fdf6e3;
  --card:#ffffff;
  --border:#e6dcc4;
  --text:#003135;
  --muted:#5a7378;
  --accent:#024950;
  --accent-2:#0FA4AF;
  --accent-bg:rgba(15,164,175,0.10);
  --key:#964734;
  --key-bg:rgba(150,71,52,0.08);
  --box-fill:#003135;
  --box-text:#e6f4f5;
  --box-line:#0FA4AF;
  --col-w:820px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background-color:var(--bg)}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  line-height:1.7;
  font-weight:400;
  font-feature-settings:"cv11","ss01","ss03";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.20  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-repeat:repeat;
  background-attachment:fixed;
}
.container{
  max-width:var(--col-w);
  margin:0 auto;
  padding:4rem 1.5rem 5rem;
}
h1{
  font-size:2.5rem;
  font-weight:300;
  letter-spacing:-0.03em;
  line-height:1.15;
  margin-bottom:.6rem;
  color:var(--text);
}
.meta{
  color:var(--muted);
  font-size:.85rem;
  letter-spacing:.01em;
  margin-bottom:2rem;
  padding-bottom:1.25rem;
  border-bottom:1px solid var(--border);
}

/* ── Exam info banner ────────────────────────────────────────────────── */
.exam-info{
  margin:0 0 3rem;
  padding:1.2rem 1.4rem;
  outline:1px solid var(--accent);
  outline-offset:5px;
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1rem;
}
.exam-info-label{
  position:absolute;top:-9px;left:14px;
  background:var(--bg);
  padding:0 .5rem;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
}
.exam-info-cell{
  text-align:center;
}
.exam-info-cell .val{
  display:block;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:1.35rem;
  font-weight:500;
  color:var(--accent-2);
  letter-spacing:.02em;
}
.exam-info-cell .lbl{
  display:block;
  font-size:.65rem;
  color:var(--muted);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-top:.2rem;
}
.exam-info-note{
  grid-column:1 / -1;
  margin-top:.6rem;
  padding-top:.7rem;
  border-top:1px dashed var(--border);
  font-size:.78rem;
  color:var(--muted);
  font-style:italic;
  text-align:center;
}

/* ── Question card ───────────────────────────────────────────────────── */
.question{
  background:var(--card);
  border:1px solid var(--border);
  padding:1.8rem 2rem;
  margin-bottom:2rem;
}
.question-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  margin-bottom:1.2rem;
  padding-bottom:.7rem;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.q-num{
  font-size:.75rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.12em;
  text-transform:uppercase;
}
.q-tags{
  display:flex;
  gap:.6rem;
  flex-wrap:wrap;
  align-items:center;
}
.q-tag{
  font-size:.7rem;
  color:var(--muted);
  letter-spacing:.06em;
  text-transform:uppercase;
  font-family:'JetBrains Mono',ui-monospace,monospace;
}
.q-tag.weight{color:var(--accent-2);font-weight:600}
.q-tag.module{color:var(--accent)}
.q-tag.time{
  border:1px solid var(--border);
  padding:.15rem .55rem;
  color:var(--text);
}

/* The exam prompt itself — declarative, Cozzi-style */
.q-prompt{
  font-size:1.05rem;
  line-height:1.65;
  margin-bottom:1.5rem;
  color:var(--text);
}
.q-prompt strong{color:var(--accent);font-weight:600}
.q-prompt em{font-style:italic}

/* ── Reveal buttons + content ────────────────────────────────────────── */
.reveal-row{
  display:flex;
  gap:.75rem;
  align-items:center;
  flex-wrap:wrap;
  margin-top:1.2rem;
  padding-top:1rem;
  border-top:1px dashed var(--border);
}
.reveal-btn{
  background:transparent;
  color:var(--accent);
  border:1px dashed var(--accent);
  padding:.5rem 1.1rem;
  font-size:.72rem;
  font-family:inherit;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s, color .15s, border-style .15s;
}
.reveal-btn:hover{background:var(--accent);color:#fff;border-style:solid}
.reveal-btn.primary{
  background:var(--accent);
  color:#fff;
  border-style:solid;
}
.reveal-btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.reveal-hint-text{
  font-size:.7rem;
  color:var(--muted);
  font-style:italic;
  letter-spacing:.03em;
}

/* Skeleton (intermediate self-check) */
.skeleton{
  display:none;
  margin-top:1.2rem;
  padding:1rem 1.25rem;
  background:var(--accent-bg);
  border-left:2px solid var(--accent-2);
  font-size:.92rem;
  line-height:1.65;
}
.skeleton.shown{display:block}
.skeleton-title{
  font-size:.7rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:.55rem;
}
.skeleton ul,.skeleton ol{margin:0 0 0 1.2rem;padding:0}
.skeleton li{margin-bottom:.35rem}

/* Model answer (full essay) */
.model-answer{
  display:none;
  margin-top:1.2rem;
  padding:1.5rem 1.75rem;
  background:rgba(255,255,255,0.6);
  border:1px solid var(--border);
  font-size:.95rem;
  line-height:1.75;
}
.model-answer.shown{display:block}
.model-answer-title{
  font-size:.7rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:.9rem;
  padding-bottom:.4rem;
  border-bottom:1px solid var(--accent-bg);
}
.model-answer h3,.model-answer h4{
  font-size:.78rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-top:1.4rem;
  margin-bottom:.6rem;
  padding-bottom:.3rem;
  border-bottom:1px solid var(--accent-bg);
}
.model-answer h3:first-child,.model-answer h4:first-child{margin-top:0}
.model-answer p{margin-bottom:.85rem}
.model-answer ol,.model-answer ul{margin:0 0 1rem 1.5rem}
.model-answer li{margin-bottom:.4rem}
.model-answer code{
  background:var(--accent-bg);
  color:var(--accent);
  padding:.1rem .35rem;
  border-radius:2px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.85em;
}
.model-answer .key-result{
  background:var(--box-fill);
  color:var(--box-text);
  padding:.85rem 1.2rem;
  margin:1rem 0;
  outline:1px solid var(--box-line);
  outline-offset:3px;
}
.model-answer .key-result .katex{color:var(--box-text)}
.model-answer .key-result strong{color:var(--box-line);font-weight:600}
.katex{font-size:1em}
.katex-display{margin:1rem 0;overflow-x:auto;overflow-y:hidden}

/* ── Footer ──────────────────────────────────────────────────────────── */
.footer-row{
  display:flex;justify-content:center;
  margin:2.5rem 0 0;
  gap:.75rem;
  flex-wrap:wrap;
}
.footer-btn{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:.6rem 1.4rem;
  font-size:.72rem;
  font-family:inherit;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s, color .15s;
}
.footer-btn:hover{background:var(--accent);color:#fff}

@media(max-width:700px){
  .container{padding:2rem 1rem 3rem}
  .question{padding:1.25rem}
  h1{font-size:1.8rem}
  .exam-info{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="container">
<h1>{{TITLE}}</h1>
<div class="meta">{{META}}</div>
{{EXAM_INFO}}
{{QUESTIONS}}
<div class="footer-row">
<button class="footer-btn" type="button" onclick="revealAll('skeleton')">Reveal all skeletons</button>
<button class="footer-btn" type="button" onclick="revealAll('model-answer')">Reveal all model answers</button>
</div>
</div>
<script>
function toggleSection(btn, targetClass){
  const card=btn.closest('.question');
  const sec=card.querySelector('.'+targetClass);
  if(!sec)return;
  const shown=sec.classList.toggle('shown');
  // Update the button label to reflect state
  const original=btn.dataset.label||btn.textContent;
  btn.dataset.label=original;
  btn.textContent=shown?'Hide '+original.replace(/^(Reveal|Show) /,'').toLowerCase():original;
}
function revealAll(targetClass){
  document.querySelectorAll('.'+targetClass).forEach(s=>s.classList.add('shown'));
}
document.addEventListener('DOMContentLoaded',()=>{
  renderMathInElement(document.body,{delimiters:[
    {left:"$$",right:"$$",display:true},
    {left:"$",right:"$",display:false},
    {left:"\\(",right:"\\)",display:false},
    {left:"\\[",right:"\\]",display:true}
  ]});
});
</script>
</body>
</html>
