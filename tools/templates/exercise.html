<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
{{PLOTLY_SCRIPT}}
{{FIGURE_JS}}
<style>
:root{
  --bg:#fdf6e3;
  --card:#ffffff;
  --border:#e6dcc4;
  --text:#003135;
  --muted:#5a7378;
  --accent:#024950;
  --accent-2:#0FA4AF;
  --accent-bg:rgba(15,164,175,0.10);
  --key:#964734;
  --key-bg:rgba(150,71,52,0.08);
  --box-fill:#003135;
  --box-text:#e6f4f5;
  --box-line:#0FA4AF;
  --col-w:820px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background-color:var(--bg)}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  line-height:1.7;
  font-weight:400;
  font-feature-settings:"cv11","ss01","ss03";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.20  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-repeat:repeat;
  background-attachment:fixed;
}
.container{
  max-width:var(--col-w);
  margin:0 auto;
  padding:4rem 1.5rem 5rem;
}
h1{
  font-size:2.5rem;
  font-weight:300;
  letter-spacing:-0.03em;
  line-height:1.15;
  margin-bottom:.6rem;
  color:var(--text);
}
.meta{
  color:var(--muted);
  font-size:.85rem;
  font-weight:400;
  letter-spacing:.01em;
  margin-bottom:2rem;
  padding-bottom:1.25rem;
  border-bottom:1px solid var(--border);
}

/* ── Coverage banner ─────────────────────────────────────────────────── */
.coverage{
  margin:0 0 3rem;
  padding:1.25rem 1.4rem;
  outline:1px solid var(--accent);
  outline-offset:5px;
  position:relative;
}
.coverage-label{
  position:absolute;top:-9px;left:14px;
  background:var(--bg);
  padding:0 .5rem;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
}
.coverage-scope{
  font-size:.78rem;
  color:var(--muted);
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:.7rem;
}
.coverage-scope strong{color:var(--accent);font-weight:600}
.coverage-list{
  list-style:none;
  font-size:.92rem;
  display:grid;
  gap:.45rem;
}
.coverage-list li{
  display:flex;
  gap:.85rem;
  align-items:baseline;
}
.coverage-list .cov-num{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.75rem;
  color:var(--accent-2);
  font-weight:600;
  min-width:2rem;
}
.coverage-excluded{
  margin-top:.9rem;
  padding-top:.7rem;
  border-top:1px dashed var(--border);
  font-size:.82rem;
  color:var(--muted);
  font-style:italic;
}

/* ── Exercise card ───────────────────────────────────────────────────── */
.exercise{
  background:var(--card);
  border:1px solid var(--border);
  padding:1.75rem 2rem;
  margin-bottom:2rem;
}
.exercise-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  margin-bottom:.4rem;
  padding-bottom:.7rem;
  border-bottom:1px solid var(--border);
}
.exercise-number{
  font-size:.75rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.12em;
  text-transform:uppercase;
}
.exercise-title{
  font-size:1.25rem;
  font-weight:400;
  letter-spacing:-0.01em;
  color:var(--text);
  flex:1;
}
.exercise-scope{
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:.04em;
  margin-bottom:1.4rem;
  font-style:italic;
}
.exercise-scope strong{color:var(--accent);font-style:normal;font-weight:600;letter-spacing:.02em}

/* ── Sub-move ────────────────────────────────────────────────────────── */
.sub-move{
  margin-bottom:1.5rem;
  padding-top:.8rem;
}
.sub-move:first-of-type{padding-top:0}
.sub-move-label{
  display:inline-block;
  font-size:.7rem;
  font-weight:600;
  color:var(--accent-2);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:.55rem;
  padding-bottom:.25rem;
  border-bottom:1px solid var(--accent-2);
}
.sub-move-prompt{
  font-size:.97rem;
  line-height:1.7;
}
.sub-move-prompt p{margin-bottom:.7rem}
.sub-move-prompt p:last-child{margin-bottom:0}
.sub-move-prompt ol,.sub-move-prompt ul{margin:0 0 .8rem 1.5rem}
.sub-move-prompt li{margin-bottom:.3rem}

/* Hints — progressive reveal per sub-move */
.hints-area{margin-top:.9rem}
.hint{
  display:none;
  background:var(--accent-bg);
  border-left:2px solid var(--accent-2);
  padding:.7rem 1rem;
  margin-top:.5rem;
  font-size:.88rem;
  line-height:1.6;
  color:var(--text);
}
.hint.shown{display:block}
.hint strong{color:var(--accent);font-weight:600;letter-spacing:.02em}
.hint-btn{
  background:transparent;
  color:var(--accent);
  border:1px dashed var(--accent);
  padding:.4rem 1rem;
  font-size:.7rem;
  font-family:inherit;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s, color .15s, border-style .15s;
  margin-top:.6rem;
}
.hint-btn:hover{background:var(--accent);color:#fff;border-style:solid}
.hint-btn[hidden]{display:none}

/* Embedded figure inside a sub-move */
.exercise .mf-figure{margin:1rem 0 1.2rem;border-color:var(--border)}

/* ── Solution (hidden by default; matches lecture body style) ────────── */
.solution-toggle-row{
  margin-top:1.5rem;
  padding-top:1.2rem;
  border-top:1px dashed var(--border);
  display:flex;
  align-items:center;
  gap:.9rem;
}
.solution-btn{
  background:var(--accent);
  color:#fff;
  border:1px solid var(--accent);
  padding:.55rem 1.3rem;
  font-size:.78rem;
  font-family:inherit;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s;
}
.solution-btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.solution-hint-text{
  font-size:.72rem;
  color:var(--muted);
  font-style:italic;
  letter-spacing:.03em;
}
.solution{
  display:none;
  margin-top:1.25rem;
  padding:1.5rem 1.75rem;
  background:rgba(255,255,255,0.6);
  border:1px solid var(--border);
  font-size:.95rem;
  line-height:1.75;
}
.solution.shown{display:block}
.solution h3,.solution h4{
  font-size:.78rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:1.4rem;
  margin-bottom:.6rem;
  padding-bottom:.3rem;
  border-bottom:1px solid var(--accent-bg);
}
.solution h3:first-child,.solution h4:first-child{margin-top:0}
.solution p{margin-bottom:.85rem}
.solution ol,.solution ul{margin:0 0 1rem 1.5rem}
.solution li{margin-bottom:.45rem}
.solution code{
  background:var(--accent-bg);
  color:var(--accent);
  padding:.1rem .35rem;
  border-radius:2px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.85em;
}
.solution .step{
  margin-bottom:1rem;
  padding-left:1rem;
  border-left:2px solid var(--accent-bg);
}
.solution .step-label{
  display:block;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.72rem;
  color:var(--accent-2);
  font-weight:600;
  letter-spacing:.06em;
  margin-bottom:.3rem;
}
.solution .key-result{
  background:var(--box-fill);
  color:var(--box-text);
  padding:.85rem 1.2rem;
  margin:1rem 0;
  outline:1px solid var(--box-line);
  outline-offset:3px;
}
.solution .key-result .katex{color:var(--box-text)}
.solution .key-result strong{color:var(--box-line);font-weight:600}
.katex{font-size:1em}
.katex-display{margin:1rem 0;overflow-x:auto;overflow-y:hidden}

/* ── Show-all bottom button ──────────────────────────────────────────── */
.show-all-row{
  display:flex;justify-content:center;
  margin:2.5rem 0 0;
}
.show-all-btn{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:.6rem 1.5rem;
  font-size:.75rem;
  font-family:inherit;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s, color .15s;
}
.show-all-btn:hover{background:var(--accent);color:#fff}

{{FIGURE_CSS}}
@media(max-width:700px){
  .container{padding:2rem 1rem 3rem}
  .exercise{padding:1.25rem}
  h1{font-size:1.8rem}
}
</style>
</head>
<body>
<div class="container">
<h1>{{TITLE}}</h1>
<div class="meta">{{META}}</div>
{{COVERAGE}}
{{EXERCISES}}
<div class="show-all-row">
<button class="show-all-btn" type="button" onclick="revealAllSolutions()">Reveal all solutions</button>
</div>
</div>

<script>
function nextHint(btn){
  const move=btn.closest('.sub-move');
  const total=parseInt(move.dataset.hintsTotal);
  let shown=parseInt(move.dataset.hintsShown||'0');
  const next=shown+1;
  const hint=move.querySelector('.hint[data-idx="'+next+'"]');
  if(hint){
    hint.classList.add('shown');
    move.dataset.hintsShown=next;
  }
  if(next>=total){
    btn.hidden=true;
  }else{
    btn.textContent='Hint '+(next+1)+' / '+total;
  }
}
function toggleSolution(btn){
  const card=btn.closest('.exercise');
  const sol=card.querySelector('.solution');
  const shown=sol.classList.toggle('shown');
  btn.textContent=shown?'Hide solution':'Show solution';
}
function revealAllSolutions(){
  document.querySelectorAll('.solution').forEach(s=>s.classList.add('shown'));
  document.querySelectorAll('.solution-btn').forEach(b=>b.textContent='Hide solution');
}
document.addEventListener('DOMContentLoaded',()=>{
  renderMathInElement(document.body,{delimiters:[
    {left:"$$",right:"$$",display:true},
    {left:"$",right:"$",display:false},
    {left:"\\(",right:"\\)",display:false},
    {left:"\\[",right:"\\]",display:true}
  ]});
});
</script>
</body>
</html>
