<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#fdf6e3;
  --card:#ffffff;
  --border:#e6dcc4;
  --text:#003135;
  --muted:#5a7378;
  --accent:#024950;
  --accent-2:#0FA4AF;
  --accent-bg:rgba(15,164,175,0.10);
  --key:#964734;
  --key-bg:rgba(150,71,52,0.08);
  --box-fill:#003135;
  --box-text:#e6f4f5;
  --box-line:#0FA4AF;
  --nav-w:240px;
  --col-w:820px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background-color:var(--bg)}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  line-height:1.65;
  font-weight:400;
  font-feature-settings:"cv11","ss01","ss03";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.20  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-repeat:repeat;
  background-attachment:fixed;
}
.layout{display:block;min-height:100vh}
nav{
  width:var(--nav-w);
  position:fixed;top:0;left:0;height:100vh;overflow-y:auto;
  background:transparent;
  border-right:1px solid var(--border);
  padding:2.5rem 1.25rem;
}
nav h2{
  font-size:.7rem;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:1rem;
  letter-spacing:.12em;
  font-weight:600;
}
nav a{
  display:block;
  padding:.35rem .6rem;
  font-size:.78rem;
  color:var(--muted);
  text-decoration:none;
  border-radius:5px;
  margin-bottom:1px;
  font-weight:400;
  transition:color .15s, background .15s;
}
nav a:hover{color:var(--text);background:rgba(2,73,80,0.04)}
nav a.active{color:var(--accent);background:var(--accent-bg);font-weight:500}
nav .nav-section-label{
  font-size:.62rem;
  text-transform:uppercase;
  color:var(--muted);
  letter-spacing:.1em;
  margin:1rem 0 .35rem .6rem;
  font-weight:600;
  opacity:.7;
}
main{
  margin-left:var(--nav-w);
  padding:3rem max(1.5rem, calc((100vw - var(--nav-w) - var(--col-w)) / 2)) 4rem;
}
h1{
  font-size:2.3rem;
  font-weight:300;
  letter-spacing:-0.03em;
  line-height:1.15;
  margin-bottom:.4rem;
  color:var(--text);
}
.meta{
  color:var(--muted);
  font-size:.8rem;
  letter-spacing:.01em;
  margin-bottom:2.5rem;
  padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}

/* ── Section ─────────────────────────────────────────────────────────── */
.section{
  margin-bottom:3.5rem;
}
.section-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  margin-bottom:1rem;
  padding-bottom:.7rem;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.section-num{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.75rem;
  font-weight:600;
  color:var(--accent-2);
  letter-spacing:.06em;
}
.section h2{
  font-size:1.5rem;
  font-weight:400;
  letter-spacing:-0.02em;
  color:var(--accent);
  flex:1;
}
.section-tag{
  font-size:.65rem;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
}

/* Elevator pitch (the "this model is FOR" framing) */
.pitch{
  background:rgba(255,255,255,0.4);
  border-left:2px solid var(--accent-2);
  padding:.8rem 1.1rem;
  margin:0 0 1.25rem;
  font-size:.95rem;
  font-style:italic;
  color:var(--text);
}
.pitch strong{color:var(--accent);font-style:normal;font-weight:600}

/* Slide images embedded */
.slide-block{
  margin:1.25rem 0;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.slide-block img{
  max-width:100%;
  height:auto;
  border:1px solid var(--border);
  background:#fff;
}
.slide-caption{
  margin-top:.4rem;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.7rem;
  color:var(--muted);
  letter-spacing:.04em;
  text-align:center;
}
.slide-group{
  display:grid;
  gap:.8rem;
  margin:1.25rem 0;
}
.slide-group.cols-2{grid-template-columns:1fr 1fr}
.slide-group.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.slide-group.cols-2,.slide-group.cols-3{grid-template-columns:1fr}}

/* Skeleton derivation (numbered algebraic steps) */
.skeleton{
  background:rgba(255,255,255,0.5);
  border:1px solid var(--border);
  padding:1rem 1.2rem;
  margin:1.25rem 0;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:.88rem;
}
.skeleton-title{
  font-size:.7rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:.6rem;
  font-family:'Inter',sans-serif;
}
.skeleton-step{
  display:grid;
  grid-template-columns:2.5rem 1fr 1fr;
  gap:.8rem;
  align-items:baseline;
  padding:.25rem 0;
  line-height:1.5;
}
.skeleton-step .step-num{
  color:var(--muted);
  font-size:.7rem;
  font-weight:500;
}
.skeleton-step .step-math{color:var(--text)}
.skeleton-step .step-why{
  color:var(--muted);
  font-style:italic;
  font-size:.82rem;
  font-family:'Inter',sans-serif;
}

/* Mock answer (Cozzi-style prose) */
.mock-answer{
  margin:1.25rem 0;
}
.mock-answer-title{
  font-size:.7rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:.55rem;
  padding-bottom:.3rem;
  border-bottom:1px solid var(--accent-bg);
}
.mock-answer p{margin-bottom:.7rem;font-size:.95rem;line-height:1.7}
.mock-answer p:last-child{margin-bottom:0}
.mock-answer em{font-style:italic}
.mock-answer strong{color:var(--accent);font-weight:600}

/* Key result HUD callouts */
.key-result{
  background:var(--box-fill);
  color:var(--box-text);
  padding:.8rem 1.15rem;
  margin:.9rem 0;
  outline:1px solid var(--box-line);
  outline-offset:3px;
  font-size:.92rem;
}
.key-result .katex{color:var(--box-text)}
.key-result strong{color:var(--box-line);font-weight:600}

/* Pitfalls (light) */
.pitfalls{
  background:var(--key-bg);
  border-left:2px solid var(--key);
  padding:.6rem .9rem;
  margin:1rem 0;
  font-size:.85rem;
}
.pitfalls-title{
  font-size:.65rem;
  font-weight:600;
  color:var(--key);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:.35rem;
}
.pitfalls ul{margin:0 0 0 1.2rem;padding:0}
.pitfalls li{margin-bottom:.25rem;color:var(--text)}

/* Reference table (notation, glossary, etc.) */
table.ref{
  width:100%;
  border-collapse:collapse;
  margin:1rem 0;
  font-size:.88rem;
}
table.ref th,table.ref td{
  padding:.5rem .8rem;
  border-bottom:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}
table.ref th{
  background:var(--accent-bg);
  font-weight:600;
  color:var(--accent);
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:.08em;
}
table.ref tr:hover td{background:rgba(15,164,175,0.04)}
table.ref code{
  background:var(--accent-bg);
  color:var(--accent);
  padding:.08rem .3rem;
  border-radius:2px;
  font-family:'JetBrains Mono',monospace;
  font-size:.85em;
}

/* Cross-cutting comparison cards */
.compare-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  gap:.8rem;
  margin:1.25rem 0;
}
.compare-card{
  background:rgba(255,255,255,0.6);
  border:1px solid var(--border);
  padding:.85rem 1rem;
  font-size:.88rem;
}
.compare-card-title{
  font-size:.7rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:.4rem;
  padding-bottom:.25rem;
  border-bottom:1px solid var(--accent-bg);
}
.compare-card p{margin-bottom:.4rem;line-height:1.55}
.compare-card p:last-child{margin-bottom:0}

/* Answer structure card (top reference) */
.structure-card{
  background:var(--box-fill);
  color:var(--box-text);
  padding:1.2rem 1.5rem;
  margin:1.25rem 0;
  outline:1px solid var(--box-line);
  outline-offset:3px;
}
.structure-card h3{
  font-size:.7rem;
  font-weight:600;
  color:var(--box-line);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:.7rem;
}
.structure-card ol{
  margin:0 0 0 1.4rem;
  font-size:.92rem;
  line-height:1.7;
}
.structure-card li{margin-bottom:.35rem}
.structure-card strong{color:var(--box-line);font-weight:600}

.katex{font-size:1em}
.katex-display{margin:.6rem 0;overflow-x:auto;overflow-y:hidden}

@media(max-width:900px){
  nav{display:none}
  main{margin-left:0;padding:2rem 1rem 3rem}
  h1{font-size:1.7rem}
}
</style>
</head>
<body>
<div class="layout">
<nav>
<h2>Contents</h2>
{{NAV_LINKS}}
</nav>
<main>
<h1>{{TITLE}}</h1>
<div class="meta">{{META}}</div>
{{SECTIONS}}
</main>
</div>
<script>
renderMathInElement(document.body,{delimiters:[
  {left:"$$",right:"$$",display:true},
  {left:"$",right:"$",display:false},
  {left:"\\(",right:"\\)",display:false},
  {left:"\\[",right:"\\]",display:true}
]});
const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll("nav a").forEach(a=>a.classList.remove("active"));const a=document.querySelector(`nav a[href="#${e.target.id}"]`);if(a)a.classList.add("active")}})},{threshold:0.3});
document.querySelectorAll(".section").forEach(s=>obs.observe(s));
</script>
</body>
</html>
